name: dailycheck-staging

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /data/dailycheck/postgres:/var/lib/postgresql
      - ./postgres/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - app

  minio:
    image: ${MINIO_SERVER_IMAGE:?MINIO_SERVER_IMAGE must be an approved pinned tag or digest}
    command: server --console-address ":9001" /data --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /data/dailycheck/minio:/data
      - /opt/dailycheck-staging/secrets/minio.license:/minio.license:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - app

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:?MINIO_CLIENT_IMAGE must be an approved pinned tag or digest}
    environment:
      APP_ORIGIN: ${APP_ORIGIN}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    volumes:
      - ./minio/init.sh:/init.sh:ro
      - ./minio/cors.xml.template:/cors.xml.template:ro
      - ./minio/app-policy.json.template:/app-policy.json.template:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - app

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ENDPOINT: ""
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const req=http.get('http://127.0.0.1:3000/api/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1);});"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - app

  gateway:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      APP_HOST: ${APP_HOST}
      STORAGE_HOST: ${STORAGE_HOST}
      NGINX_ENVSUBST_FILTER: "^(APP_HOST|STORAGE_HOST)$"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /data/dailycheck/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
